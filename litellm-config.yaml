# LiteLLM — único punto de salida hacia Google Gemini (AI Studio).
# El prefijo gemini/ es obligatorio. Sin él LiteLLM intenta Vertex AI.

model_list:
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1048576

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: true
      max_input_tokens: 1048576

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # Alias legado del repo original
  - model_name: gemini-1.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  num_retries: 2
  timeout: 180
  fallbacks:
    - gemini-pro: [gemini-flash]
    - gemini-2.5-pro: [gemini-2.5-flash, gemini-flash]
    - gemini-1.5-pro: [gemini-pro, gemini-flash]

litellm_settings:
  drop_params: true
  modify_params: true
  set_verbose: false
  request_timeout: 180

# Sin master_key. El entrypoint también hace unset de LITELLM_MASTER_KEY
# porque Coolify puede inyectar el secreto igual y reactivar auth.
general_settings:
  store_model_in_db: false
