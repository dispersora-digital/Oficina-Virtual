# Coolify → New Resource → Public Git Repository → Docker Compose
# Repo: https://github.com/dispersora-digital/Oficina-Virtual
# Branch: main
# Base Directory: /
# Compose file: docker-compose.yaml
#
# Paperclip (orquestador) → Hermes (agentes) → LiteLLM → Google Gemini
#
# No publiques LiteLLM ni Hermes en un dominio. Solo Paperclip
# debe tener FQDN en Coolify (ej. https://oficina.dispersora.digital:3100).

services:
  litellm:
    build:
      context: .
      dockerfile: litellm.Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # No pasar LITELLM_MASTER_KEY: activa virtual keys y, sin DB,
      # /v1/models responde 400 "No connected db".
      LITELLM_MASTER_KEY: ""
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\" || exit 1",
        ]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s

  paperclip:
    build:
      context: .
      dockerfile: paperclip.Dockerfile
    restart: unless-stopped
    expose:
      - "3100"
    environment:
      HOST: "0.0.0.0"
      PORT: "3100"
      SERVE_UI: "true"
      NODE_ENV: production
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: ${PAPERCLIP_DEPLOYMENT_MODE:-authenticated}
      PAPERCLIP_DEPLOYMENT_EXPOSURE: ${PAPERCLIP_DEPLOYMENT_EXPOSURE:-private}
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-https://oficina.dispersora.digital}
      PAPERCLIP_ALLOWED_HOSTNAMES: ${PAPERCLIP_ALLOWED_HOSTNAMES:-oficina.dispersora.digital,paperclip,localhost,127.0.0.1}
      BETTER_AUTH_URL: ${PAPERCLIP_PUBLIC_URL:-https://oficina.dispersora.digital}
      BETTER_AUTH_BASE_URL: ${PAPERCLIP_PUBLIC_URL:-https://oficina.dispersora.digital}
      BETTER_AUTH_TRUSTED_ORIGINS: ${PAPERCLIP_PUBLIC_URL:-https://oficina.dispersora.digital}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      PAPERCLIP_AGENT_JWT_SECRET: ${PAPERCLIP_AGENT_JWT_SECRET:?}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_BASE: http://litellm:4000/v1
      OPENAI_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      HERMES_GATEWAY_API_BASE_URL: http://hermes-adapter:8080
      HERMES_GATEWAY_API_KEY: ${API_SERVER_KEY:?}
      HERMES_GATEWAY_ALLOW_INSECURE_HTTP: "1"
    volumes:
      - paperclip_data:/paperclip
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 20s
      timeout: 8s
      retries: 20
      start_period: 90s

  hermes-adapter:
    build:
      context: .
      dockerfile: hermes.Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8080"
    environment:
      PORT: "8080"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gemini-flash}
      LITELLM_BASE_URL: http://litellm:4000/v1
      OPENAI_API_BASE: http://litellm:4000/v1
      OPENAI_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      PAPERCLIP_URL: http://paperclip:3100
      PAPERCLIP_API_URL: http://paperclip:3100
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY:-}
      PAPERCLIP_AGENT_ID: ${PAPERCLIP_AGENT_ID:-6cf8b305-6eef-4c46-941f-29e1d67c01ab}
      PAPERCLIP_COMPANY_ID: ${PAPERCLIP_COMPANY_ID:-69a05954-6dfe-451c-b51a-de595c3f40f4}
      PAPERCLIP_AGENT_JWT_SECRET: ${PAPERCLIP_AGENT_JWT_SECRET}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8080"
      API_SERVER_KEY: ${API_SERVER_KEY:?}
      API_SERVER_CORS_ORIGINS: "*"
      HERMES_GATEWAY_ALLOW_INSECURE_HTTP: "1"
    volumes:
      - hermes_data:/root/.hermes
    depends_on:
      litellm:
        condition: service_healthy
      paperclip:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/health || curl -fsS http://127.0.0.1:8080/v1/models || exit 1",
        ]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 50s

volumes:
  paperclip_data:
  hermes_data:
