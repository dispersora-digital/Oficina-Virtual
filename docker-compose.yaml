version: '3.8'

services:
  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    container_name: paperclip
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - paperclip_data:/app/data
    networks:
      - dispersora_net

  hermes-adapter:
    build:
      context: .
      dockerfile: hermes.Dockerfile
    container_name: hermes-adapter
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_MODEL=gemini-1.5-pro
      - PAPERCLIP_URL=http://paperclip:3000
      - PORT=8080
    volumes:
      - hermes_data:/root/.hermes
    depends_on:
      - paperclip
    networks:
      - dispersora_net

networks:
  dispersora_net:
    driver: bridge

volumes:
  paperclip_data:
  hermes_data:
