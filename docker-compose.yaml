version: '3.8'

services:
  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    container_name: paperclip
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=dispersora-paperclip-secure-auth-jwt-token-2026
      - BETTER_AUTH_URL=https://oficina.dispersora.digital
    volumes:
      - paperclip_data:/paperclip/instances
    networks:
      - dispersora_net

  hermes-adapter:
    build:
      context: .
      dockerfile: hermes.Dockerfile
    container_name: hermes-adapter
    restart: unless-stopped
    init: true
    ports:
      - "8090:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_MODEL=gemini-1.5-pro
      - PAPERCLIP_URL=http://paperclip:3000
      - PORT=8080
      - HERMES_HOST=127.0.0.1
      - DASHBOARD_HOST=127.0.0.1
    command: ["adapter", "--host", "127.0.0.1", "--port", "8080"]
    volumes:
      - hermes_data:/root/.hermes
    depends_on:
      - paperclip
    networks:
      - dispersora_net

networks:
  dispersora_net:
    driver: bridge

volumes:
  paperclip_data:
  hermes_data:
