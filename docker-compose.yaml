version: '3.8'

services:
  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    container_name: paperclip
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=dispersora-paperclip-secure-auth-jwt-token-2026
      - BETTER_AUTH_URL=https://oficina.dispersora.digital
    volumes:
      - paperclip_data:/paperclip/instances
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - dispersora_net

  hermes-adapter:
    build:
      context: .
      dockerfile: hermes.Dockerfile
    container_name: hermes-adapter
    restart: unless-stopped
    init: true
    ports:
      - "8090:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_MODEL=gemini-1.5-pro
      - PAPERCLIP_URL=http://paperclip:3000
      - PORT=8080
      - HOST=127.0.0.1
      - DASHBOARD_HOST=127.0.0.1
    volumes:
      - hermes_data:/root/.hermes
    depends_on:
      paperclip:
        condition: service_healthy
    networks:
      - dispersora_net

networks:
  dispersora_net:
    driver: bridge

volumes:
  paperclip_data:
  hermes_data:
