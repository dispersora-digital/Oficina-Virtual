version: '3.8'

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    networks:
      - dispersora_net

  paperclip:
    build:
      context: .
      dockerfile: paperclip.Dockerfile
    container_name: paperclip
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=dispersora-paperclip-secure-auth-jwt-token-2026
      - BETTER_AUTH_URL=https://oficina.dispersora.digital
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PAPERCLIP_AGENT_JWT_SECRET=dispersora-hermes-secure-agent-jwt-token-2026
    volumes:
      - paperclip_data:/paperclip/instances
    networks:
      - dispersora_net

  hermes-adapter:
    build:
      context: .
      dockerfile: hermes.Dockerfile
    container_name: hermes-adapter
    restart: unless-stopped
    init: true
    ports:
      - "8090:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_MODEL=gemini-1.5-pro
      - PAPERCLIP_URL=http://paperclip:3000
      - PORT=8080
      - PAPERCLIP_AGENT_JWT_SECRET=dispersora-hermes-secure-agent-jwt-token-2026
      - OPENAI_API_BASE=http://litellm:4000/v1
      - OPENAI_API_KEY=sk-litellm-proxy-internal
    volumes:
      - hermes_data:/root/.hermes
    depends_on:
      - paperclip
      - litellm
    networks:
      - dispersora_net

networks:
  dispersora_net:
    driver: bridge

volumes:
  paperclip_data:
  hermes_data:
